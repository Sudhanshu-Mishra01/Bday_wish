[build]
  publish = "."

# Clean admin & dashboard routes for monitoring
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin_server.py"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/.backups/*"
  to = "/"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
